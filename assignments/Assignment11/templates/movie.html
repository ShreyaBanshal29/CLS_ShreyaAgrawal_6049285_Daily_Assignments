<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Movies</title>
</head>

<body style="font-family:Arial; margin:40px;">

	<h2>Add Movie</h2>

	<form th:action="@{/addMovie}" th:object="${movie}">
		<input type="text" name="name" placeholder="Movie Name" th:field="*{name}" required />
		<input type="number" step="0.1" name="rating" placeholder="Rating" th:field="*{rating}" required />

		<select name="genre" th:field="*{genre}" >
			<option value="">--Select Genre--</option>
			<option value="Drama">Drama</option>
			<option value="Fiction">Fiction</option>
			<option value="Satire">Satire</option>
		</select>

		<button type="submit">Add</button>
	</form>

	<hr>

	<h2>Search by Genre</h2>

	<form action="searchMovie" method="post">
		<select name="genre">
			<option value="">--Select Genre--</option>
			<option value="Drama">Drama</option>
			<option value="Fiction">Fiction</option>
			<option value="Satire">Satire</option>
		</select>

		<button type="submit">Search</button>
	</form>

	<hr>

	<h2>Movie List</h2>

	<table border="1" cellpadding="10">
		<tr>
			<th>ID</th>
			<th>Name</th>
			<th>Rating</th>
			<th>Genre</th>
			<th>Action</th>
		</tr>

		<tr th:each="m : ${movies}">
			<td th:text="${m.id}"></td>
			<td th:text="${m.name}"></td>
			<td th:text="${m.rating}"></td>
			<td th:text="${m.genre}"></td>
			<td>
				<a th:href="@{/deleteMovie(name=${m.name})}">
					Delete
				</a>
			</td>
		</tr>
	</table>

</body>

</html>
